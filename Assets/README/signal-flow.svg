<svg width="1280" height="500" viewBox="0 0 1280 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">MACQ signal flow</title>
<desc id="desc">A left-to-right diagram showing microphone and app audio flowing through MACQ processing into the MicEQ virtual microphone and then into communication apps.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#38BDF8"/></marker></defs>
<rect width="1280" height="500" rx="28" fill="#0F172A"/>
<text x="70" y="78" fill="#F8FAFC" font-family="Inter, Arial" font-size="38" font-weight="850">Signal flow</text>
<text x="70" y="114" fill="#94A3B8" font-family="Inter, Arial" font-size="20">MACQ keeps the path explicit: capture, process, publish as a virtual microphone.</text>
<g font-family="Inter, Arial" font-size="20" font-weight="750">
  <rect x="70" y="190" width="200" height="112" rx="22" fill="#1E293B" stroke="#334155"/>
  <text x="170" y="240" fill="#F8FAFC" text-anchor="middle">Input mic</text>
  <text x="170" y="270" fill="#94A3B8" font-size="16" font-weight="500" text-anchor="middle">CoreAudio device</text>
  <rect x="70" y="330" width="200" height="86" rx="22" fill="#1E293B" stroke="#334155"/>
  <text x="170" y="378" fill="#F8FAFC" text-anchor="middle">App audio</text>
  <text x="170" y="402" fill="#94A3B8" font-size="16" font-weight="500" text-anchor="middle">Optional source</text>
  <rect x="398" y="226" width="220" height="144" rx="24" fill="#082F49" stroke="#38BDF8"/>
  <text x="508" y="282" fill="#E0F2FE" text-anchor="middle">MACQ engine</text>
  <text x="508" y="314" fill="#BAE6FD" font-size="16" font-weight="500" text-anchor="middle">EQ, gain, voice tools</text>
  <rect x="746" y="226" width="220" height="144" rx="24" fill="#064E3B" stroke="#34D399"/>
  <text x="856" y="282" fill="#D1FAE5" text-anchor="middle">MicEQ driver</text>
  <text x="856" y="314" fill="#A7F3D0" font-size="16" font-weight="500" text-anchor="middle">Virtual microphone</text>
  <rect x="1094" y="226" width="130" height="144" rx="24" fill="#1E293B" stroke="#334155"/>
  <text x="1159" y="284" fill="#F8FAFC" text-anchor="middle">Apps</text>
  <text x="1159" y="314" fill="#94A3B8" font-size="16" font-weight="500" text-anchor="middle">Discord, OBS</text>
</g>
<path d="M270 246 C330 246 330 270 398 270" stroke="#38BDF8" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
<path d="M270 373 C330 373 330 330 398 330" stroke="#38BDF8" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
<path d="M618 298 L746 298" stroke="#38BDF8" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
<path d="M966 298 L1094 298" stroke="#38BDF8" stroke-width="6" fill="none" marker-end="url(#arrow)"/>
</svg>